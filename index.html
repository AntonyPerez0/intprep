<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IntPrep — Master the coding interview, one pattern at a time</title>
    <meta
      name="description"
      content="Learn the 150 classic coding interview problems step by step: pick the code while it's new, type it once you know it, then keep it in memory with spaced review, streaks and games."
    />
    <meta name="theme-color" content="#fbf4e2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1c15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>IntPrep needs JavaScript to run.</noscript>
    <script>
      // The app's code needs a browser from 2023 or later (Safari and iOS 16.4, Chrome 107,
      // Firefox 104). An older one cannot load it and would show a blank page, so say why. The
      // test is the newest thing the code relies on: a lookbehind in a regular expression.
      (function () {
        try {
          new RegExp('(?<=a)b');
        } catch (e) {
          document.getElementById('root').innerHTML =
            '<div style="max-width:34em;margin:15vh auto;padding:0 24px;font:16px/1.6 system-ui,-apple-system,sans-serif">' +
            '<h1 style="font-size:22px;margin:0 0 8px">IntPrep needs a newer browser</h1>' +
            '<p style="margin:0">This browser is too old to run it. On an iPhone or iPad, update to iOS 16.4 or later ' +
            '(Settings, General, Software Update). Otherwise open IntPrep in a current Safari, Chrome, Firefox or Edge.</p></div>';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
