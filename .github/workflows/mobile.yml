name: Mobile apps

# Builds the Android and iOS apps (docs/MOBILE.md). Not part of every push: run it by hand from the
# Actions tab, or push a tag such as v1.0.0. Nothing here is published: the Android job
# leaves a debug APK (signed with a fixed test key) to install on a phone, and the iOS job proves the Xcode project compiles.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 compiles with Java 21. The Android SDK is already on the runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - name: Copy the site into the Android project
        run: npx cap sync android
      # Every run signs with the same test key, so a newer APK installs over an older one and the
      # progress on the phone survives. The key is the repository secret ANDROID_TEST_KEYSTORE_BASE64
      # (docs/MOBILE.md); android/app/build.gradle signs debug builds with INTPREP_TEST_KEYSTORE.
      - name: Use the fixed test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/intprep-test.keystore"
            keytool -list -keystore "$RUNNER_TEMP/intprep-test.keystore" -storetype pkcs12 -storepass android | grep -i 'fingerprint'
            echo "INTPREP_TEST_KEYSTORE=$RUNNER_TEMP/intprep-test.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_TEST_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key."
          fi
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Check which key signed the APK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          signed=$("$tools/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256')
          echo "$signed"
          # The fixed test key's certificate (docs/MOBILE.md). A different one would break updates on testers' phones.
          if [ -n "$INTPREP_TEST_KEYSTORE" ]; then
            echo "$signed" | grep -qi 'e22a1fd3323e64dc07c483228d2b0c68e77368e575425c49427ab4b6d9db1dcc'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: intprep-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator build, unsigned)
    # Capacitor 8 needs Xcode 26, the one on the macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy the site into the Xcode project
        run: npx cap sync ios
      - name: Show Xcode and the project's schemes
        working-directory: ios/App
        run: |
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj
      # No signing: a simulator build needs none, and it is enough to prove that the project and
      # its Swift packages (Capacitor and the plugins) compile.
      - name: Build for the simulator
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip the app
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent App.app "$RUNNER_TEMP/IntPrep-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: intprep-ios-simulator-app
          path: ${{ runner.temp }}/IntPrep-simulator.zip
          if-no-files-found: error
